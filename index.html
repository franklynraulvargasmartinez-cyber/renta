<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagos de renta</title>
<style>
:root{--bg:#F2F5F4;--surface:#FFFFFF;--ink:#14282C;--mute:#5B6E72;--line:#D3DEDB;--ok:#1B6F46;--okbg:#DCF0E5;--warn:#8F5200;--warnbg:#FAEACB;--bad:#A8301B;--badbg:#F9DDD6;--accent:#14535C;--onaccent:#FFFFFF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A1C;--surface:#162528;--ink:#E7F0EE;--mute:#93A8AB;--line:#2A3E41;--ok:#6FD0A0;--okbg:#17372A;--warn:#F0B35A;--warnbg:#3A2B12;--bad:#F0907D;--badbg:#3F1D17;--accent:#7CC4CC;--onaccent:#0E1A1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A1C;--surface:#162528;--ink:#E7F0EE;--mute:#93A8AB;--line:#2A3E41;--ok:#6FD0A0;--okbg:#17372A;--warn:#F0B35A;--warnbg:#3A2B12;--bad:#F0907D;--badbg:#3F1D17;--accent:#7CC4CC;--onaccent:#0E1A1C;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.25rem;margin:4px 0 14px}
h2{font-size:1.05rem;margin:0 0 10px}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hero{border-width:2px;padding:20px}
.hero.si{background:var(--okbg);border-color:var(--ok)}
.hero.parcial{background:var(--warnbg);border-color:var(--warn)}
.hero.no{background:var(--badbg);border-color:var(--bad)}
.hero .big{font-size:1.6rem;font-weight:700;line-height:1.2;margin:0 0 6px}
.hero.si .big{color:var(--ok)}.hero.parcial .big{color:var(--warn)}.hero.no .big{color:var(--bad)}
.hero p{margin:0}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px}
button.main{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600;width:100%;margin-top:14px;padding:13px}
button.small{padding:6px 10px;font-size:.9rem}
.yearbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.yearbar strong{font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{padding:10px 4px;text-align:center;font-size:.9rem;border-width:2px}
.cell small{display:block;font-size:.75rem}
.cell.si{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.parcial{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.legend{font-size:.85rem;color:var(--mute);margin:10px 0 0}
.pago{border-top:1px solid var(--line);padding:12px 0}
.pago:first-of-type{border-top:0}
.pago .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.pago .meta{color:var(--mute);font-size:.9rem;margin:2px 0 8px}
.acts{display:flex;gap:8px}
.empty{color:var(--mute);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
details summary{cursor:pointer;font-weight:600}
details>div{margin-top:8px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px;z-index:20}
#modal.open{display:block}
.recibo{max-width:480px;margin:0 auto;background:#fff;color:#14282C;border-radius:10px;padding:22px}
.recibo h3{margin:0 0 4px;font-size:1.2rem}
.recibo .no{color:#5B6E72;margin:0 0 14px}
.recibo p{margin:8px 0}
.recibo .firma{margin-top:36px;border-top:1px solid #14282C;padding-top:4px;font-size:.9rem}
.mact{max-width:480px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px}
.mact button{flex:1 1 44%}
.msg{font-size:.9rem;color:var(--ok);margin:8px 0 0;min-height:1.2em}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;padding:0}.mact{display:none}}
</style>
</head>
<body>
<main>
  <h1>Pagos de renta</h1>
  <section id="login" hidden>
    <h2>Entrar</h2>
    <label for="pin">PIN o clave</label><input id="pin" type="password" autocomplete="current-password">
    <button class="main" data-act="login">Entrar</button>
    <p class="msg" id="loginmsg" role="status" style="color:var(--bad)"></p>
  </section>
  <div id="app">
  <section id="hero" class="hero"></section>
  <section><h2>Meses pendientes</h2><div id="pend"></div></section>

  <section>
    <h2>Registrar un pago</h2>
    <div class="row">
      <div><label for="f-mes">Mes que pagas</label><input id="f-mes" type="month"></div>
      <div><label for="f-fecha">Fecha en que pagas</label><input id="f-fecha" type="date"></div>
    </div>
    <div class="row">
      <div><label for="f-monto">Monto (RD$)</label><input id="f-monto" type="number" inputmode="decimal" min="0" step="any"></div>
      <div><label for="f-recibe">Entregado a</label><input id="f-recibe" type="text" placeholder="Nombre de quien recibe"></div>
    </div>
    <label for="f-nota">Nota (opcional)</label>
    <input id="f-nota" type="text" placeholder="Ej.: pagado en efectivo">
    <button class="main" data-act="add">Guardar pago y ver recibo</button>
    <p class="msg" id="addmsg" role="status"></p>
  </section>

  <section>
    <div class="yearbar">
      <button class="small" data-act="yprev" aria-label="Año anterior">‹</button>
      <strong id="year"></strong>
      <button class="small" data-act="ynext" aria-label="Año siguiente">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="legend">Verde: pagado. Amarillo: pago parcial. Sin color: sin pago registrado. Toca un mes para ver sus pagos.</p>
  </section>

  <section>
    <h2 id="lt">Pagos</h2>
    <div id="list"></div>
  </section>

  <section>
    <details>
      <summary>Datos de la renta</summary>
      <div>
        <label for="c-inq">Tu nombre (inquilino)</label><input id="c-inq" type="text">
        <label for="c-dueno">Nombre de la dueña</label><input id="c-dueno" type="text">
        <label for="c-dir">Dirección de la casa</label><input id="c-dir" type="text">
        <label for="c-monto">Renta mensual (RD$)</label><input id="c-monto" type="number" inputmode="decimal" min="0" step="any">
        <label for="c-inicio">Mes en que empezó la renta</label><input id="c-inicio" type="month">
        <button class="main" data-act="cfg">Guardar datos</button>
        <p class="msg" id="cfgmsg" role="status"></p>
      </div>
    </details>
  </section>

  <section>
    <p class="empty" id="sync" role="status"></p>
    <div class="acts" style="margin-top:8px"><button class="small" data-act="reload">Actualizar</button><button class="small" data-act="csv">Descargar Excel (CSV)</button><button class="small" data-act="logout">Cambiar PIN</button></div>
  </section>
  </div>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-label="Recibo de pago">
  <div class="recibo" id="recibo"></div>
  <div class="mact">
    <button data-act="shareimg">Compartir imagen</button>
    <button data-act="print">Imprimir</button>
    <button data-act="wa">WhatsApp (texto)</button>
    <button data-act="saveimg">Guardar imagen</button>
    <button data-act="copyrec">Copiar texto</button>
    <button data-act="close">Cerrar</button>
  </div>
  <p class="msg" id="recmsg" style="text-align:center;color:#fff" role="status"></p>
</div>

<script>
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const KEY='pagos-renta-v1';
let S={cfg:{inq:'',dueno:'',dir:'',monto:0},pagos:[],next:1};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.cfg=Object.assign({inq:'',dueno:'',dir:'',monto:0},o.cfg||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const API='https://script.google.com/macros/s/AKfycbyJzTkDd5kLHB4zpZUno2QzjO3w-c6f5rL9YH5mJOpkpHJ_kFzRGG_jTy2zVuI4sK8z/exec';
let PIN='';try{PIN=localStorage.getItem('pagos-renta-pin')||''}catch(e){}
let loaded=false,dupKey=null;
async function api(body){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN},body))});
  const j=await r.json();
  if(!j.ok)throw new Error(j.error||'Error');
  return j;
}
const setSync=(t,bad)=>{const e=$('sync');e.textContent=t;e.style.color=bad?'var(--bad)':''};
async function load(){
  setSync('Sincronizando…');
  try{
    const j=await api({action:'get'});
    S.cfg=Object.assign({inq:'',dueno:'',dir:'',inicio:'',monto:0},j.cfg);S.pagos=j.pagos;S.next=j.next;save();
    $('login').hidden=true;$('app').hidden=false;
    if(!loaded){loaded=true;init()}else renderAll();
    setSync('Guardado en la nube (Google Sheets). Actualizado '+new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'})+'.');
  }catch(err){
    if(err.message==='PIN'){$('app').hidden=true;$('login').hidden=false;$('loginmsg').textContent='PIN incorrecto.';return}
    $('login').hidden=true;$('app').hidden=false;if(!loaded){loaded=true;init()}
    setSync('Sin conexión con la nube. Ves la última copia guardada. No registres pagos hasta reconectar.',true);
  }
}
async function addPago(d){
  const m=$('addmsg');m.style.color='';m.textContent='Guardando…';
  try{
    const j=await api({action:'add',pago:d});
    S.pagos.push(j.pago);S.next=j.pago.no+1;save();
    m.textContent='';$('f-nota').value='';
    year=+d.mes.slice(0,4);filter=d.mes;renderAll();showRec(j.pago);
  }catch(err){m.style.color='var(--bad)';m.textContent=err.message==='PIN'?'PIN incorrecto. Cámbialo abajo.':'No se pudo guardar. El pago NO quedó registrado. Revisa tu conexión e inténtalo otra vez.'}
}
async function delPago(id){
  try{await api({action:'del',id});S.pagos=S.pagos.filter(x=>x.id!==id);delId=null;save();renderAll()}
  catch(err){delId=null;renderList();setSync('No se pudo borrar. Revisa tu conexión.',true)}
}
async function saveCfg(c){
  const m=$('cfgmsg');m.style.color='';m.textContent='Guardando…';
  try{await api({action:'cfg',cfg:c});S.cfg=c;save();if(!$('f-monto').value&&c.monto)$('f-monto').value=c.monto;m.textContent='Datos guardados.';setTimeout(()=>m.textContent='',2500);renderAll()}
  catch(err){m.style.color='var(--bad)';m.textContent='No se pudieron guardar. Revisa tu conexión.'}
}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function renderPend(){
  const el=$('pend'),ini=S.cfg.inicio;
  if(!ini){el.innerHTML='<p class="empty">Escribe en “Datos de la renta” el mes en que empezó para ver qué meses faltan por pagar.</p>';return}
  const out=[];let [y,m]=ini.split('-').map(Number);
  const [cy,cm]=curKey.split('-').map(Number);
  while((y<cy||(y===cy&&m<=cm))&&out.length<600){const k=y+'-'+pad(m);if(stateOf(k)!=='si')out.push(k);m++;if(m>12){m=1;y++}}
  el.innerHTML=out.length?'<p class="empty">Estos meses no aparecen pagados completos. Toca uno para registrarlo.</p><div class="chips">'+out.map(k=>'<button class="small" data-act="pm" data-k="'+k+'">'+esc(label(k))+'</button>').join('')+'</div>':'<p class="empty">Todos los meses desde '+esc(label(ini).toLowerCase())+' hasta hoy están pagados.</p>';
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'RD$ '+Number(n||0).toLocaleString('es-DO',{maximumFractionDigits:2});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const label=k=>{const a=k.split('-');return cap(MES[+a[1]-1])+' '+a[0]};
const fdate=d=>{const a=d.split('-');return +a[2]+' de '+MES[+a[1]-1]+' de '+a[0]};
const pad=n=>String(n).padStart(2,'0');
const now=new Date();
const todayStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const curKey=now.getFullYear()+'-'+pad(now.getMonth()+1);
let year=now.getFullYear(), filter=null, delId=null, curRec=null;

const paid=k=>S.pagos.filter(p=>p.mes===k).reduce((a,p)=>a+Number(p.monto),0);
const stateOf=k=>{const t=paid(k);if(!t)return'no';if(S.cfg.monto&&t<S.cfg.monto)return'parcial';return'si'};
const pad4=n=>String(n).padStart(4,'0');

function recText(p){
  const c=S.cfg;
  return 'RECIBO DE PAGO DE RENTA No. '+pad4(p.no)+'\n'+
  'Fecha de pago: '+fdate(p.fecha)+'\n'+
  'Recibí de: '+(c.inq||'__________')+'\n'+
  'La suma de: '+money(p.monto)+'\n'+
  'Por concepto de: renta del mes de '+label(p.mes).toLowerCase()+(c.dir?' de la vivienda ubicada en '+c.dir:'')+(c.dueno?', propiedad de '+c.dueno:'')+'.\n'+
  'Entregado a: '+(p.recibe||'__________')+(p.nota?'\nNota: '+p.nota:'')+'\n'+
  'Firma de quien recibe: ______________________';
}

function renderHero(){
  const st=stateOf(curKey),h=$('hero'),t=paid(curKey);
  const last=S.pagos.filter(p=>p.mes===curKey).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
  h.className='hero '+st;
  let big,sub;
  if(st==='si'){big=label(curKey)+': pagado';sub='Pagaste '+money(t)+' el '+fdate(last.fecha)+(last.recibe?', entregado a '+esc(last.recibe):'')+'.'}
  else if(st==='parcial'){big=label(curKey)+': pago parcial';sub='Llevas '+money(t)+' de '+money(S.cfg.monto)+'. Faltan '+money(S.cfg.monto-t)+'.'}
  else{big=label(curKey)+': sin pago registrado';sub='Si ya pagaste, regístralo abajo para tener el recibo.'}
  h.innerHTML='<p class="big">'+esc(big)+'</p><p>'+sub+'</p>';
}

function renderGrid(){
  $('year').textContent=year;
  let h='';
  for(let m=0;m<12;m++){
    const k=year+'-'+pad(m+1),st=stateOf(k);
    h+='<button class="cell '+st+(filter===k?' sel':'')+'" data-act="month" data-k="'+k+'"><span>'+cap(MES[m].slice(0,3))+'</span><small>'+(st==='si'?'Pagado':st==='parcial'?'Parcial':'Sin pago')+'</small></button>';
  }
  $('grid').innerHTML=h;
}

function renderList(){
  let arr=S.pagos.slice();
  if(filter){arr=arr.filter(p=>p.mes===filter);$('lt').textContent='Pagos de '+label(filter).toLowerCase()}
  else{arr=arr.filter(p=>p.mes.startsWith(year+'-'));$('lt').textContent='Pagos de '+year+' (total '+money(arr.reduce((a,p)=>a+p.monto,0))+')'}
  arr.sort((a,b)=>b.mes.localeCompare(a.mes)||b.fecha.localeCompare(a.fecha));
  if(!arr.length){
    $('list').innerHTML='<p class="empty">'+(filter?'No hay pagos registrados para '+esc(label(filter).toLowerCase())+'. Ese mes no aparece pagado.':'Aún no hay pagos registrados en '+year+'.')+'</p>'+(filter?'':'');
    return;
  }
  $('list').innerHTML=(filter?'<p style="margin:0 0 6px"><button class="small" data-act="all">Ver todo el año</button></p>':'')+arr.map(p=>
    '<div class="pago"><div class="top"><span>'+esc(label(p.mes))+'</span><span>'+money(p.monto)+'</span></div>'+
    '<div class="meta">Pagado el '+fdate(p.fecha)+(p.recibe?'. Entregado a '+esc(p.recibe):'')+'. Recibo No. '+pad4(p.no)+(p.nota?'. '+esc(p.nota):'')+'</div>'+
    '<div class="acts"><button class="small" data-act="rec" data-id="'+p.id+'">Ver recibo</button><button class="small" data-act="del" data-id="'+p.id+'">'+(delId===p.id?'¿Seguro? Toca otra vez':'Borrar')+'</button></div></div>'
  ).join('');
}

function renderAll(){renderPend();renderHero();renderGrid();renderList()}

function showRec(p){
  curRec=p;const c=S.cfg;
  $('recibo').innerHTML='<h3>Recibo de pago de renta</h3><p class="no">No. '+pad4(p.no)+'</p>'+
  '<p><strong>Fecha de pago:</strong> '+esc(fdate(p.fecha))+'</p>'+
  '<p><strong>Recibí de:</strong> '+esc(c.inq||'__________')+'</p>'+
  '<p><strong>La suma de:</strong> '+money(p.monto)+'</p>'+
  '<p><strong>Por concepto de:</strong> renta del mes de '+esc(label(p.mes).toLowerCase())+(c.dir?' de la vivienda ubicada en '+esc(c.dir):'')+(c.dueno?', propiedad de '+esc(c.dueno):'')+'.</p>'+
  '<p><strong>Entregado a:</strong> '+esc(p.recibe||'__________')+'</p>'+(p.nota?'<p><strong>Nota:</strong> '+esc(p.nota)+'</p>':'')+
  '<div class="firma">Firma de quien recibe</div>';
  $('recmsg').textContent='';
  $('modal').classList.add('open');
}

function copy(text,okEl,okMsg){
  const done=()=>{okEl.textContent=okMsg;setTimeout(()=>okEl.textContent='',2500)};
  const fb=()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){okEl.textContent='No se pudo copiar. Selecciona el texto manualmente.'}t.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='add'){
    const mes=$('f-mes').value,fecha=$('f-fecha').value,monto=parseFloat($('f-monto').value);
    if(!mes||!fecha||!(monto>0)){$('addmsg').style.color='var(--bad)';$('addmsg').textContent='Completa el mes, la fecha y un monto mayor que cero.';return}
    if(stateOf(mes)==='si'&&dupKey!==mes){dupKey=mes;const w=$('addmsg');w.style.color='var(--warn)';w.textContent=label(mes)+' ya aparece pagado. Toca otra vez para guardar de todos modos.';return}
    dupKey=null;
    addPago({mes,fecha,monto,recibe:$('f-recibe').value.trim(),nota:$('f-nota').value.trim()});
  }
  else if(a==='month'){filter=filter===b.dataset.k?null:b.dataset.k;renderGrid();renderList()}
  else if(a==='all'){filter=null;renderGrid();renderList()}
  else if(a==='yprev'){year--;filter=null;renderGrid();renderList()}
  else if(a==='ynext'){year++;filter=null;renderGrid();renderList()}
  else if(a==='rec'){const p=S.pagos.find(x=>x.id==b.dataset.id);if(p)showRec(p)}
  else if(a==='del'){
    const id=+b.dataset.id;
    if(delId===id){delPago(id)}
    else{delId=id;renderList()}
  }
  else if(a==='close'){$('modal').classList.remove('open')}
  else if(a==='shareimg'){if(curRec)shareImg(curRec)}
  else if(a==='saveimg'){if(curRec)saveImg(curRec)}
  else if(a==='wa'){if(curRec){const w=window.open('https://wa.me/?text='+encodeURIComponent(recText(curRec)),'_blank');if(!w)copy(recText(curRec),$('recmsg'),'Recibo copiado. Pégalo en WhatsApp.')}}
  else if(a==='copyrec'){if(curRec)copy(recText(curRec),$('recmsg'),'Recibo copiado. Pégalo en un mensaje.')}
  else if(a==='cfg'){saveCfg({inq:$('c-inq').value.trim(),dueno:$('c-dueno').value.trim(),dir:$('c-dir').value.trim(),monto:parseFloat($('c-monto').value)||0,inicio:$('c-inicio').value})}
  else if(a==='pm'){$('f-mes').value=b.dataset.k;$('f-mes').scrollIntoView({behavior:'smooth',block:'center'})}
  else if(a==='print'){try{window.print()}catch(err){$('recmsg').textContent='No se pudo imprimir. Usa Guardar imagen.'}}
  else if(a==='csv'){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Recibo','Mes','Fecha de pago','Monto','Entregado a','Nota']].concat(S.pagos.slice().sort((a,b)=>a.mes.localeCompare(b.mes)||a.fecha.localeCompare(b.fecha)).map(p=>[pad4(p.no),p.mes,p.fecha,p.monto,p.recibe,p.nota]));dl(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}),'pagos-renta.csv')}
  else if(a==='login'){PIN=$('pin').value.trim();if(!PIN)return;try{localStorage.setItem('pagos-renta-pin',PIN)}catch(err){}load()}
  else if(a==='reload'){load()}
  else if(a==='logout'){PIN='';try{localStorage.removeItem('pagos-renta-pin')}catch(err){}$('app').hidden=true;$('login').hidden=false;$('pin').value='';$('loginmsg').textContent=''}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PIN&&loaded&&!$('app').hidden)load()});
function recBlob(p){
  const c=S.cfg,W=600,P=28,F='24px system-ui,sans-serif',B='bold 24px system-ui,sans-serif';
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const items=[['k','Fecha de pago:',fdate(p.fecha)],['k','Recibí de:',c.inq||'__________'],['k','La suma de:',money(p.monto)],['k','Por concepto de:','renta del mes de '+label(p.mes).toLowerCase()+(c.dir?' de la vivienda ubicada en '+c.dir:'')+(c.dueno?', propiedad de '+c.dueno:'')+'.'],['k','Entregado a:',p.recibe||'__________']];
  if(p.nota)items.push(['k','Nota:',p.nota]);
  const wrap=t=>{x.font=F;const o=[];let l='';t.split(' ').forEach(w=>{const n=l?l+' '+w:w;if(x.measureText(n).width>W-2*P&&l){o.push(l);l=w}else l=n});o.push(l);return o};
  const rows=[{f:'bold 30px system-ui,sans-serif',t:'RECIBO DE PAGO DE RENTA',g:40},{f:F,t:'No. '+pad4(p.no),g:46}];
  items.forEach(it=>{rows.push({f:B,t:it[1],g:32});const L=wrap(it[2]);L.forEach((l,i)=>rows.push({f:F,t:l,g:i===L.length-1?42:32}))});
  const H=rows.reduce((a,r)=>a+r.g,0)+2*P+110;
  cv.width=W;cv.height=H;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.textBaseline='top';
  let y=P;rows.forEach(r=>{x.font=r.f;x.fillText(r.t,P,y);y+=r.g});
  y+=56;x.fillRect(P,y,W-2*P,2);x.font='20px system-ui,sans-serif';x.fillText('Firma de quien recibe',P,y+8);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function saveImg(p){
  try{dl(await recBlob(p),'recibo-'+pad4(p.no)+'.png');$('recmsg').textContent='Imagen guardada.'}catch(err){$('recmsg').textContent='No se pudo guardar la imagen.'}
}
async function shareImg(p){
  const m=$('recmsg');
  try{
    const file=new File([await recBlob(p)],'recibo-'+pad4(p.no)+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Recibo de renta'});return}
    if(navigator.share){await navigator.share({text:recText(p)});return}
    m.textContent='Compartir no está disponible aquí. Usa Guardar imagen o WhatsApp (texto).';
  }catch(err){if(!err||err.name!=='AbortError')m.textContent='No se pudo compartir desde aquí. Usa Guardar imagen o WhatsApp (texto).'}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});

function init(){
  $('f-mes').value=curKey;$('f-fecha').value=todayStr;
  $('f-monto').value=S.cfg.monto||'';
  $('c-inq').value=S.cfg.inq;$('c-dueno').value=S.cfg.dueno;$('c-dir').value=S.cfg.dir;$('c-monto').value=S.cfg.monto||'';$('c-inicio').value=S.cfg.inicio||'';
  renderAll();
}
if(API.startsWith('PEGA')||!PIN){$('app').hidden=true;$('login').hidden=false;if(API.startsWith('PEGA'))$('loginmsg').textContent='Falta pegar la URL de Apps Script en la constante API del archivo.'}else{loaded=true;init();load()}
</script>
